<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setwork</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setwork">
<meta name="theme-color" content="#14192b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ---------- tokens ---------- */
  :root{
    --paper:#f6f2ea;
    --card:#ffffff;
    --ink:#14192b;
    --ink-soft:#5b6172;
    --line:#e4ddd0;
    --ember:#c8342a;
    --ember-ink:#ffffff;
    --gold:#b6791f;
    --sage:#3f7350;
    --sage-tint:#e7f0e8;
    --shadow: 0 1px 2px rgba(20,25,43,0.06), 0 6px 20px -8px rgba(20,25,43,0.18);
    /* fixed poster chrome — always dark, deliberately does not flip with theme */
    --chrome-bg:#14192b;
    --chrome-fg:#f6f2ea;
    --chrome-fg-soft:rgba(246,242,234,0.65);
    --chrome-ember:#c8342a;
    --chrome-ember-ink:#ffffff;
    --chrome-gold:#e0a94a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12151f;
      --card:#1b1f2e;
      --ink:#f1ede4;
      --ink-soft:#9a9fb0;
      --line:#2b3042;
      --ember:#ef6155;
      --ember-ink:#1a0f0d;
      --gold:#e0a94a;
      --sage:#6fae7f;
      --sage-tint:#1c2b21;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12151f;
    --card:#1b1f2e;
    --ink:#f1ede4;
    --ink-soft:#9a9fb0;
    --line:#2b3042;
    --ember:#ef6155;
    --ember-ink:#1a0f0d;
    --gold:#e0a94a;
    --sage:#6fae7f;
    --sage-tint:#1c2b21;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.45;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  .display{font-family:"Anton", "Arial Narrow", sans-serif; font-weight:400; letter-spacing:0.01em;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; cursor:pointer;}
  input, textarea{font-family:inherit; color:inherit;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--ember); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--chrome-bg); color:var(--chrome-fg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .display{font-size:20px; letter-spacing:0.02em;}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--chrome-ember); display:inline-block;}
  .streak{
    display:flex; align-items:center; gap:6px;
    font-family:"IBM Plex Mono", monospace; font-size:13px; font-weight:600;
    color:var(--chrome-gold); background:rgba(255,255,255,0.08); border-radius:999px;
    padding:5px 10px 5px 8px;
  }
  .day-tabs{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px;
    padding-bottom:2px; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; padding:7px 14px; border-radius:999px;
    font-size:13px; font-weight:600; letter-spacing:0.02em;
    color:rgba(246,242,234,0.65); background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    white-space:nowrap;
  }
  .day-tab[aria-selected="true"]{ background:var(--chrome-ember); color:var(--chrome-ember-ink); border-color:transparent;}
  .day-tab.add{ color:var(--chrome-gold); background:transparent; border:1px dashed rgba(230,190,120,0.4); font-size:16px; padding:7px 12px;}

  /* ---------- layout ---------- */
  main{max-width:560px; margin:0 auto; padding:18px 16px 8px;}

  .hero{
    background: var(--card); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .hero-band{
    background:var(--chrome-bg); color:var(--chrome-fg);
    padding:16px 16px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .hero-titles{min-width:0;}
  .hero-kicker{
    display:inline-block; background:var(--chrome-ember); color:var(--chrome-ember-ink);
    font-family:"Anton", sans-serif; font-size:13px; letter-spacing:0.06em;
    padding:3px 9px; border-radius:5px; margin-bottom:8px;
  }
  .hero-title{font-size:26px; line-height:1.02; word-break:break-word;}
  .hero-sub{color:var(--chrome-fg-soft); font-size:12.5px; margin-top:6px; letter-spacing:0.02em;}
  .edit-btn{
    color:rgba(246,242,234,0.7); border:1px solid rgba(246,242,234,0.25); border-radius:999px;
    padding:6px 12px; font-size:12px; font-weight:600; flex:0 0 auto;
  }
  .edit-btn[data-on="true"]{ background:var(--chrome-ember); color:var(--chrome-ember-ink); border-color:transparent;}

  .info-strip{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);}
  .info-cell{ background:var(--card); padding:12px 14px;}
  .info-label{ font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--gold); text-transform:uppercase; margin-bottom:3px;}
  .info-val{ font-size:13.5px; font-weight:600;}
  .info-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px;}

  .section-label{
    font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin: 20px 2px 8px;
  }

  /* ---------- exercise card ---------- */
  .ex-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden;
  }
  .ex-head{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px;}
  .ex-num{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:var(--ember); color:var(--ember-ink); font-family:"IBM Plex Mono"; font-weight:600; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .ex-name{ font-size:15.5px; font-weight:700; flex:1; min-width:0;}
  .ex-target{
    flex:0 0 auto; font-family:"IBM Plex Mono"; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); background:var(--paper); border:1px solid var(--line);
    padding:3px 8px; border-radius:7px; white-space:nowrap;
  }
  .ex-muscle{ padding:0 14px; font-size:11.5px; color:var(--sage); font-weight:600; letter-spacing:0.02em; text-transform:uppercase; margin-bottom:8px;}
  .ex-cue{ padding:0 14px 12px; font-size:13px; color:var(--ink-soft);}
  .ex-log{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); background:var(--paper);}
  .set-dots{ display:flex; gap:7px; flex-wrap:wrap; flex:1;}
  .set-dot{
    width:30px; height:30px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-family:"IBM Plex Mono"; font-weight:600; font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .set-dot[aria-pressed="true"]{ background:var(--sage); border-color:var(--sage); color:#fff;}
  .weight-field{ display:flex; align-items:center; gap:4px; flex:0 0 auto;}
  .weight-field input{
    width:52px; text-align:right; border:1.5px solid var(--line); border-radius:8px;
    padding:6px 6px; font-size:13px; background:var(--card); color:var(--ink);
  }
  .weight-field span{ font-size:11px; color:var(--ink-soft);}
  .ex-remove{ color:var(--ember); font-size:12px; font-weight:600; padding:4px 8px;}
  .progress-hint{
    display:flex; align-items:center; gap:6px; padding:8px 14px; font-size:12px;
    color:var(--sage); background:var(--paper); border-top:1px solid var(--line);
    font-weight:600; line-height:1.35;
  }
  .progress-hint::before{ content:"↗"; font-size:13px; flex:0 0 auto;}

  /* ---------- edit mode fields ---------- */
  .edit-row{ display:flex; gap:8px; padding:8px 14px; flex-wrap:wrap;}
  .edit-row input, .edit-row textarea{
    border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
    background:var(--card); color:var(--ink); width:100%;
  }
  .field-pair{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 14px 8px;}
  .field-pair label, .full-field label{ font-size:11px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:3px;}
  .full-field{ padding:0 14px 10px;}
  .add-ex-btn{
    display:block; width:calc(100% - 0px); margin:2px 0 14px; padding:12px; text-align:center;
    border:1.5px dashed var(--line); border-radius:12px; color:var(--ink-soft); font-weight:600; font-size:13.5px;
  }

  .simple-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
    margin-bottom:10px; box-shadow:var(--shadow);
  }
  .simple-card .title{ font-weight:700; font-size:13.5px; margin-bottom:8px; display:flex; align-items:center; gap:7px;}
  .simple-card .swatch{ width:9px; height:9px; border-radius:3px; background:var(--gold); flex:0 0 auto;}
  .simple-card ul{ margin:0; padding-left:18px; font-size:13px; color:var(--ink-soft);}
  .simple-card li{ margin-bottom:4px;}
  .simple-card p{ margin:0; font-size:13px; color:var(--ink-soft);}
  .tips-textarea{ width:100%; min-height:70px; border:1.5px solid var(--line); border-radius:8px; padding:8px; font-size:13px; background:var(--card); color:var(--ink);}

  .history{ display:flex; gap:5px; margin-top:10px;}
  .hist-dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.12); flex:0 0 auto;}
  .hist-dot.done{ background:var(--gold);}

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--card); border-top:1px solid var(--line);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
  }
  .progress-text{ font-size:12px; color:var(--ink-soft); flex:0 0 auto; width:64px;}
  .progress-text b{ color:var(--ink); font-family:"IBM Plex Mono";}
  .complete-btn{
    flex:1; background:var(--ember); color:var(--ember-ink); font-weight:700; font-size:14.5px;
    padding:13px; border-radius:12px; letter-spacing:0.02em;
  }
  .complete-btn[data-done="true"]{ background:var(--sage);}
  .complete-btn:disabled{ opacity:0.45;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition: opacity .18s ease, transform .18s ease; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .day-menu{
    position:fixed; inset:0; background:rgba(15,18,28,0.5); z-index:40;
    display:flex; align-items:flex-end;
  }
  .day-menu-sheet{
    background:var(--card); width:100%; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .day-menu h3{ font-size:15px; margin-bottom:12px;}
  .day-menu button.opt{
    display:block; width:100%; text-align:left; padding:13px 14px; border-radius:10px;
    background:var(--paper); border:1px solid var(--line); margin-bottom:8px; font-size:14px; font-weight:600;
  }
  .day-menu .cancel{ width:100%; text-align:center; padding:12px; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- settings ---------- */
  .gear-btn{
    width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.08);
    color:var(--chrome-fg); display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto;
  }
  .settings-overlay{ position:fixed; inset:0; z-index:50; background:var(--paper); display:flex; flex-direction:column;}
  .settings-header{
    background:var(--chrome-bg); color:var(--chrome-fg); flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  }
  .settings-title{ font-size:18px; letter-spacing:0.03em;}
  .settings-close{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.1);
    color:var(--chrome-fg); font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .settings-content{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(30px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto; width:100%; box-sizing:border-box;
  }
  .equip-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .equip-chip{
    display:flex; align-items:center; gap:6px; background:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 12px; font-size:13px; font-weight:600;
  }
  .equip-x{
    width:19px; height:19px; border-radius:50%; background:var(--line); color:var(--ink-soft);
    font-size:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .add-equip-row{ display:flex; gap:8px;}
  .add-equip-row input{
    flex:1; min-width:0; border:1.5px solid var(--line); border-radius:8px; padding:9px 10px;
    font-size:13px; background:var(--card); color:var(--ink);
  }
  .add-equip-btn{ background:var(--ink); color:var(--paper); font-weight:700; font-size:13px; padding:9px 16px; border-radius:8px; flex:0 0 auto;}
  .field-label{ font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;}
  .days-row{ display:flex; gap:8px; margin-bottom:10px;}
  .day-pill{
    flex:1; text-align:center; padding:10px; border-radius:10px; border:1.5px solid var(--line);
    font-weight:700; font-size:14px; color:var(--ink-soft); background:var(--paper);
  }
  .day-pill[data-on="true"]{ background:var(--ember); border-color:transparent; color:var(--ember-ink);}
  .split-preview{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .suggest-btn{
    display:block; width:100%; background:var(--ember); color:var(--ember-ink); font-weight:700;
    font-size:14.5px; padding:13px; border-radius:12px; margin-bottom:10px;
  }
  .restore-link{ display:block; width:100%; text-align:center; color:var(--ink-soft); font-size:13px; font-weight:600; padding:6px;}

  .hero-actions{ display:flex; gap:6px; flex:0 0 auto;}
  .regen-btn{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08);
    color:var(--chrome-fg); border:1px solid rgba(255,255,255,0.2); font-size:15px;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .empty-note{ font-size:13px; color:var(--ink-soft); margin:0;}

  .log-stats{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0 0 14px;}
  .log-stats b{ color:var(--ink); font-weight:700;}
  .copy-log-btn{
    display:block; width:100%; background:var(--sage); color:#fff; font-weight:700;
    font-size:14.5px; padding:13px; border-radius:12px; margin-bottom:10px;
  }
  .log-preview-label{ font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--ink-soft); text-transform:uppercase; margin:4px 0 6px;}
  .log-preview{
    width:100%; height:110px; resize:vertical; border:1.5px solid var(--line); border-radius:10px;
    padding:10px; font-family:"IBM Plex Mono", monospace; font-size:11.5px; line-height:1.5;
    color:var(--ink-soft); background:var(--paper);
  }

  /* ---------- muscle diagram ---------- */
  .ex-body-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:0 14px 12px;}
  .ex-text-col{ flex:1; min-width:0;}
  .ex-text-col .ex-muscle{ padding:0; margin-bottom:4px;}
  .ex-cue-inline{ font-size:13px; color:var(--ink-soft);}
  .video-link{
    display:inline-flex; align-items:center; gap:4px; margin-top:6px;
    font-size:12px; font-weight:700; color:var(--ember);
  }
  .muscle-thumb{
    flex:0 0 auto; width:46px; height:64px; border-radius:10px;
    background:var(--paper); border:1px solid var(--line); overflow:hidden;
  }
  .muscle-thumb svg{ width:100%; height:100%; display:block; padding:5px; box-sizing:border-box;}
  .muscle-thumb img{ width:100%; height:100%; display:block; object-fit:cover;}
  .mbody rect, .mbody circle, .mbody path, .mbody ellipse{ fill:var(--line);}
  .mreg{ fill:var(--ink-soft); opacity:0.4; transition:fill .15s ease, opacity .15s ease;}
  .mreg.hl{ fill:var(--ember); opacity:1;}

  /* pictogram figure (exercise hint) */
  .plimb, .ptorso, .phead{ fill:var(--ink-soft);}
  .pequip{ fill:none; stroke:var(--line); stroke-width:5; stroke-linecap:round;}
  .pequipFill{ fill:var(--line);}
  .paccent{ fill:var(--ember);}
  .paccentLine{ fill:none; stroke:var(--ember); stroke-width:5; stroke-linecap:round;}

  .muscle-sheet-body{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:2px 0 16px;}
  .sheet-pictogram{
    width:220px; height:220px; border-radius:16px; overflow:hidden;
    background:var(--paper); border:1px solid var(--line);
  }
  .sheet-pictogram svg{ width:100%; height:100%; padding:18px; box-sizing:border-box; display:block;}
  .sheet-pictogram img{ width:100%; height:100%; display:block; object-fit:cover;}
  .sheet-divider{ width:60%; height:1px; background:var(--line); margin:4px 0;}
  .sheet-muscle{ width:120px;}
  .sheet-muscle svg{ width:100%; height:auto; max-height:28vh;}
  .muscle-sheet-label{ font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ember);}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><span class="dot"></span><span class="display">SETWORK</span></div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="streak" id="streak">🔥 0</div>
      <button class="gear-btn" id="gearBtn" aria-label="Settings">⚙</button>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs" role="tablist"></div>
</div>

<main id="main"></main>

<div class="bottombar">
  <div class="progress-text" id="progressText"><b>0/0</b> logged</div>
  <button class="complete-btn" id="completeBtn">Complete day</button>
</div>

<div class="toast" id="toast"></div>
<div id="menuLayer"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "setwork.v1";

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr+"T00:00:00");
    d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  /* ---------------- equipment + program generation ---------------- */

  var DEFAULT_EQUIPMENT = [
    {id:"treadmill", name:"Treadmill"},
    {id:"narrowRow", name:"Narrow Row Machine"},
    {id:"latPulldown", name:"Lat Pulldown Machine"},
    {id:"cableCrossover", name:"Cable Crossover Machine"},
    {id:"chestPress", name:"Chest Press Machine"},
    {id:"flyesMachine", name:"Flyes Machine"},
    {id:"legPress", name:"Leg Press Machine"},
    {id:"tBarRow", name:"T-Bar Row Machine"},
    {id:"shoulderPress", name:"Shoulder Press Machine"},
    {id:"smith", name:"Smith Machine"},
    {id:"hangingLegRaise", name:"Hanging Leg Raise Machine"},
    {id:"bulgarianSplitSquat", name:"Bulgarian Split Squats"},
    {id:"legExtension", name:"Standing Leg Extension Machine"},
    {id:"legCurlLying", name:"Lying Leg Curl Machine"},

  function slug(s){
    var v = String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
    return v || uid();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function equipmentIdSet(){
    var o = {};
    (state.equipment||[]).forEach(function(e){ o[e.id]=true; });
    return o;

  function poolFor(catKey){
    if(catKey==="full") return EXERCISE_LIBRARY.slice();
    if(catKey==="upper") return EXERCISE_LIBRARY.filter(function(e){ return e.categories.indexOf("push")>=0 || e.categories.indexOf("pull")>=0; });
    if(catKey==="lower") return EXERCISE_LIBRARY.filter(function(e){ return e.categories.indexOf("legs")>=0; });
    return EXERCISE_LIBRARY.filter(function(e){ return e.categories.indexOf(catKey)>=0; });
  }

  function generateExercisesForDay(catKey){
    var count = catKey==="full" ? 8 : 7;
    var equipSet = equipmentIdSet();
    var pool = poolFor(catKey).filter(function(e){ return e.equip===null || equipSet[e.equip]; });
    pool = shuffle(pool);
    var picked = [], muscleCount = {}, poseCount = {}, cap = catKey==="full" ? 1 : 2;

    // pass 1: respect both the per-muscle cap and a one-per-visual-pattern cap,
    // so two exercises that would show the same photo/pictogram don't land on
    // the same day (e.g. Rope Triceps Pushdown + Overhead Rope Extension)
    pool.forEach(function(e){
      if(picked.length>=count) return;
      var c = muscleCount[e.muscle]||0;
      var poseKey = poseForExercise(e.name);
      var pc = poseCount[poseKey]||0;
      if(c<cap && pc<1){ picked.push(e); muscleCount[e.muscle]=c+1; poseCount[poseKey]=pc+1; }
    });
    // pass 2: keep the one-per-visual-pattern rule (avoiding duplicate images
    // matters more than muscle balance), but relax the muscle cap
    if(picked.length<count){
      pool.forEach(function(e){
        if(picked.length>=count) return;
        if(picked.indexOf(e)>=0) return;
        var poseKey = poseForExercise(e.name);
        var pc = poseCount[poseKey]||0;
        if(pc<1){
          picked.push(e); muscleCount[e.muscle]=(muscleCount[e.muscle]||0)+1;
          poseCount[poseKey]=pc+1;
        }
      });
    }
    // pass 3: still respect the muscle cap, but allow repeating a visual pattern
    // if that's the only way to reach the target count
    if(picked.length<count){
      pool.forEach(function(e){
        if(picked.length>=count) return;
        if(picked.indexOf(e)>=0) return;
        var c = muscleCount[e.muscle]||0;
        if(c<cap){
          picked.push(e); muscleCount[e.muscle]=c+1;
          poseCount[poseForExercise(e.name)] = (poseCount[poseForExercise(e.name)]||0)+1;
        }
      });
    }
    // pass 4: last resort, fill remaining slots ignoring both caps
    if(picked.length<count){
      pool.forEach(function(e){
        if(picked.length<count && picked.indexOf(e)===-1) picked.push(e);
      });
    }
    picked.sort(function(a,b){ return (b.compound?1:0)-(a.compound?1:0); });
    return picked.map(function(e){
      return {name:e.name, sets:e.sets, repsLo:e.repsLo, repsHi:e.repsHi, muscle:e.muscle, cue:e.cue};
    });
  }

  function pickFinisher(catKey){
    var equipSet = equipmentIdSet();
    var matches = FINISHER_POOL.filter(function(f){
      return (catKey==="full" || f.categories.indexOf(catKey)>=0) && (f.equip===null || equipSet[f.equip]);
    });
    if(!matches.length) matches = FINISHER_POOL.filter(function(f){ return f.equip===null; });
    if(!matches.length) return null;
    return matches[Math.floor(Math.random()*matches.length)];
  }

  function buildGeneratedDay(catObj, num){

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.days) && parsed.days.length) return parsed;
      }
    }catch(e){}
    return { days: [defaultDay()], activeId: null, history: [], equipment: DEFAULT_EQUIPMENT.slice(), settings: {daysPerWeek:3}, previousPlans: [], exerciseHistory: {} };
  }
  var state = load();
  if(!state.activeId) state.activeId = state.days[0].id;
  if(!state.history) state.history = [];
  if(!state.equipment) state.equipment = DEFAULT_EQUIPMENT.slice();
  if(!state.settings) state.settings = {daysPerWeek:3};
  if(!state.settings.daysPerWeek) state.settings.daysPerWeek = 3;
  if(!state.previousPlans) state.previousPlans = [];
  if(!state.exerciseHistory) state.exerciseHistory = {};

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function snapshotPlan(){
    state.previousPlans.push({
      days: JSON.parse(JSON.stringify(state.days)),
      activeId: state.activeId,
      ts: todayStr()
    });
    if(state.previousPlans.length>8) state.previousPlans.shift();

  function suggestProgram(){
    snapshotPlan();
    var n = state.settings.daysPerWeek;
    state.days = generateProgram(n);
    state.activeId = state.days[0].id;

    save();
    closeSettings();
    renderAll();

  function restorePreviousPlan(){
    if(!state.previousPlans.length) return;
    var prev = state.previousPlans.pop();
    state.days = prev.days;
    state.activeId = state.days.some(function(d){return d.id===prev.activeId;}) ? prev.activeId : state.days[0].id;
    editMode = false;
    save();
    closeSettings();
    renderAll();
    toast("Restored previous plan");
  }

  function addEquipmentItem(name){
    name = (name||"").trim();
    if(!name) return;
    var existingIds = {};
    state.equipment.forEach(function(e){ existingIds[e.id]=true; });
    var base = slug(name), id = base, i = 1;
    while(existingIds[id]){ i++; id = base + "-" + i; }
    state.equipment.push({id:id, name:name});
    save();
  }

  function removeEquipmentItem(id){
    state.equipment = state.equipment.filter(function(e){ return e.id!==id; });
    save();

  // reset a day's live log if it wasn't touched today
  function ensureFreshLog(day){
    if(!day.log) day.log = {date:null, sets:{}, weights:{}};
    if(day.log.date !== todayStr()){
      day.log = {date: todayStr(), sets:{}, weights: day.log.weights || {}};
    }

  function computeStreak(){
    var doneDates = {};
    state.history.forEach(function(h){ doneDates[h.date] = true; });
    var cursor = todayStr();
    if(!doneDates[cursor]) cursor = addDays(cursor, -1);
    var streak = 0;
    while(doneDates[cursor]){
      streak++;
      cursor = addDays(cursor, -1);
    }
    return streak;
  }

  function buildTrainingLogText(){
    var lines = [];
    lines.push("SETWORK TRAINING LOG — exported " + todayStr());
    lines.push("");
    lines.push("Days per week: " + state.settings.daysPerWeek);
    if(state.equipment.length){
      lines.push("Equipment: " + state.equipment.map(function(e){ return e.name; }).join(", "));
    }
    var sessionCount = state.history.length;
    lines.push("Sessions completed: " + sessionCount);
    if(sessionCount){
      var dates = state.history.map(function(h){ return h.date; }).slice().sort();
      lines.push("First session: " + dates[0]);
      lines.push("Most recent session: " + dates[dates.length-1]);
    }
    lines.push("");
    lines.push("PER-EXERCISE HISTORY (most recent last)");
    var names = Object.keys(state.exerciseHistory).sort();
    if(!names.length){
      lines.push("(no exercise history logged yet — complete a day to start tracking)");
    } else {
      names.forEach(function(name){
        lines.push("- " + name + ":");
        state.exerciseHistory[name].forEach(function(h){
          var w = h.weight != null ? (h.weight + "kg") : "no weight logged";
          lines.push("    " + h.date + " — " + h.setsDone + "/" + h.setsTotal + " sets @ " + w);
        });
      });
    }
    lines.push("");
    lines.push("I'm using the Setwork app to track my workouts. Based on this log, please suggest progression, form checks, or adjustments for my next sessions.");
    return lines.join("\n");
  }

      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", String(d.id === state.activeId));
      b.textContent = "DAY " + d.num;
      b.addEventListener("click", function(){
        state.activeId = d.id; editMode = false; save(); renderAll();
      });
      wrap.appendChild(b);
    });

  function openAddDayMenu(){

    overlay.addEventListener("click", function(e){ if(e.target===overlay) layer.innerHTML=""; });
    var sheet = document.createElement("div");
    sheet.className = "day-menu-sheet";
    sheet.innerHTML = "<h3>Add a training day</h3>";
    var blank = document.createElement("button");
    blank.className = "opt"; blank.textContent = "Blank day";
    blank.addEventListener("click", function(){
      var nd = {
        id: uid(), num: nextDayNum(), title:"NEW DAY", subtitle:"",
        warmupTime:"5–10 min", warmupNote:"", restNote:"",
        exercises:[], finisher:null, tips:[], cooldownTime:"10 min", cooldownNote:"",
        log:{date:null, sets:{}, weights:{}}
      };
      state.days.push(nd); state.activeId = nd.id; editMode = true;
      save(); layer.innerHTML=""; renderAll();
    });
    var dup = document.createElement("button");
    dup.className = "opt"; dup.textContent = "Duplicate “" + activeDay().title + "”";
    dup.addEventListener("click", function(){
      var src = activeDay();
      var nd = JSON.parse(JSON.stringify(src));
      nd.id = uid(); nd.num = nextDayNum();
      nd.log = {date:null, sets:{}, weights:{}};
      state.days.push(nd); state.activeId = nd.id; editMode = true;
      save(); layer.innerHTML=""; renderAll();
    });
    var cancel = document.createElement("button");
    cancel.className = "cancel"; cancel.textContent = "Cancel";
    cancel.addEventListener("click", function(){ layer.innerHTML=""; });
    sheet.appendChild(blank); sheet.appendChild(dup); sheet.appendChild(cancel);
    overlay.appendChild(sheet);
    layer.appendChild(overlay);

  function el(tag, cls, html){

  function renderMain(){
    var day = activeDay();
    ensureFreshLog(day);

  function infoCell(label, valOrNode, subText, subNode){
    var c = el("div","info-cell");

    } else {
      c.appendChild(valOrNode);
    }
    if(subText) c.appendChild(el("div","info-sub", escapeHtml(subText)));
    if(subNode) c.appendChild(subNode);
    return c;
  }

    i.addEventListener("input", function(){ obj[key] = i.value; save(); });
    return i;

    });
  }

  function bodySilhouetteMarkup(regions){
    var regionMarkup = regions.map(function(r){

  function muscleDiagram(muscleName){
    var view = MUSCLE_VIEW[muscleName] || "front";
    var markup = view === "back" ? BACK_SVG_MARKUP : FRONT_SVG_MARKUP;
    var wrap = document.createElement("div");
    wrap.innerHTML = markup;

  /* ---------------- exercise pictogram ---------------- */
  // simple pictogram figures (Olympic-pictogram style) built from capsule limbs
  // authored by target point, not raw angles — see limbTo().

  function pLimb(ox,oy,ang,len,w){
    w = w||10;
    return '<rect class="plimb" x="'+(-w/2)+'" y="0" width="'+w+'" height="'+len+'" rx="'+(w/2)+'" transform="translate('+ox+','+oy+') rotate('+ang+')"></rect>';
  }
  function pLimbTo(ox,oy,tx,ty,w){
    var dx = tx-ox, dy = ty-oy;
    var len = Math.sqrt(dx*dx+dy*dy);
    var ang = Math.atan2(-dx,dy) * 180/Math.PI;
    return pLimb(ox,oy,ang,len,w);
  }
  function pHead(cx,cy){ return '<circle class="phead" cx="'+cx+'" cy="'+cy+'" r="9"></circle>'; }
  function pTorso(ox,oy,ang,len){
    return '<rect class="ptorso" x="-9" y="0" width="18" height="'+len+'" rx="9" transform="translate('+ox+','+oy+') rotate('+ang+')"></rect>';
  }
  function pTorsoTo(ox,oy,tx,ty){
    var dx = tx-ox, dy = ty-oy;
    var len = Math.sqrt(dx*dx+dy*dy);
    var ang = Math.atan2(-dx,dy) * 180/Math.PI;
    return pTorso(ox,oy,ang,len);
  }
  function pBar(x1,y1,x2,y2){
    return '<line class="paccentLine" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"></line>' +
           '<circle class="paccent" cx="'+x1+'" cy="'+y1+'" r="5"></circle>' +
           '<circle class="paccent" cx="'+x2+'" cy="'+y2+'" r="5"></circle>';
  }
  function pDot(cx,cy){ return '<circle class="paccent" cx="'+cx+'" cy="'+cy+'" r="5"></circle>'; }
  function pBench(x,y,w){ return '<rect class="pequipFill" x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3"></rect>'; }
  function pCable(x,y1,y2){ return '<line class="pequip" x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'"></line><rect class="pequipFill" x="'+(x-6)+'" y="'+(y1-4)+'" width="12" height="8" rx="2"></rect>'; }
  function pKb(cx,cy){ return '<circle class="paccent" cx="'+cx+'" cy="'+cy+'" r="7"></circle><rect class="paccentLine" x="'+(cx-4)+'" y="'+(cy-13)+'" width="8" height="7" rx="3" fill="none"></rect>'; }

    return EXERCISE_POSE[name] || "generic";
  }

  function exercisePictogram(name){
    var poseKey = poseForExercise(name);
    var fn = POSES[poseKey] || POSES.generic;
    var wrap = document.createElement("div");
    wrap.innerHTML = '<svg viewBox="0 0 100 100" class="pfig" xmlns="http://www.w3.org/2000/svg">' + fn() + '</svg>';
    return wrap.firstElementChild;
  }

  // real reference photo when we have one for this exercise's movement pattern;
  // falls back to the vector pictogram for anything custom/unmapped
  function exerciseVisual(name){
    var poseKey = poseForExercise(name);
    var photo = EXERCISE_PHOTOS[poseKey];
    if(photo){
      var img = document.createElement("img");
      img.src = photo;
      img.alt = name;
      img.loading = "lazy";
      return img;
    }
    return exercisePictogram(name);
  }

  function openMuscleSheet(exName, muscle){
    var layer = document.getElementById("menuLayer");
    layer.innerHTML = "";
    var overlay = el("div","day-menu");
    overlay.addEventListener("click", function(e){ if(e.target===overlay) layer.innerHTML=""; });
    var sheet = el("div","day-menu-sheet");
    sheet.appendChild(el("h3", null, escapeHtml(exName)));
    var body = el("div","muscle-sheet-body");
    var pic = el("div","sheet-pictogram");
    pic.appendChild(exerciseVisual(exName));
    body.appendChild(pic);
    if(muscle){
      body.appendChild(el("div","sheet-divider"));
      var mwrap = el("div","sheet-muscle");
      mwrap.appendChild(muscleDiagram(muscle));
      body.appendChild(mwrap);
      body.appendChild(el("div","muscle-sheet-label", escapeHtml(muscle)));
    }
    sheet.appendChild(body);
    var cancel = el("button","cancel","Close");
    cancel.addEventListener("click", function(){ layer.innerHTML=""; });
    sheet.appendChild(cancel);
    overlay.appendChild(sheet);
    layer.appendChild(overlay);
  }

  function renderExercise(day, ex, idx){
    var card = el("div","ex-card");
    var head = el("div","ex-head");
    head.appendChild(el("div","ex-num", String(idx+1)));
    if(editMode){
      var ni = document.createElement("input");
      ni.value = ex.name; ni.style.cssText="flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;font-weight:700;";
      ni.addEventListener("input", function(){ ex.name = ni.value; save(); });
      head.appendChild(ni);
      var rm = el("button","ex-remove","Remove");
      rm.addEventListener("click", function(){ day.exercises.splice(idx,1); save(); renderMain(); });
      head.appendChild(rm);
    } else {
      head.appendChild(el("div","ex-name", escapeHtml(ex.name)));
      head.appendChild(el("div","ex-target mono", ex.sets + "×" + ex.repsLo + (ex.repsHi && ex.repsHi!==ex.repsLo ? "–"+ex.repsHi : "")));
    }
    card.appendChild(head);

    if(editMode){
      var fp = el("div","field-pair");
      fp.appendChild(labeledInput("Sets", ex, "sets", "number"));
      fp.appendChild(labeledInput("Muscle", ex, "muscle", "text"));
      card.appendChild(fp);
      var fp2 = el("div","field-pair");
      fp2.appendChild(labeledInput("Reps low", ex, "repsLo", "number"));
      fp2.appendChild(labeledInput("Reps high", ex, "repsHi", "number"));
      card.appendChild(fp2);
      var cueWrap = el("div","full-field");
      var cl = document.createElement("label"); cl.textContent = "Cue"; cueWrap.appendChild(cl);
      var ci = document.createElement("input"); ci.value = ex.cue||"";
      ci.addEventListener("input", function(){ ex.cue = ci.value; save(); });
      cueWrap.appendChild(ci);
      card.appendChild(cueWrap);
    } else {
      if(ex.muscle || ex.cue){
        var bodyRow = el("div","ex-body-row");
        var textCol = el("div","ex-text-col");
        if(ex.muscle) textCol.appendChild(el("div","ex-muscle", escapeHtml(ex.muscle)));
        if(ex.cue) textCol.appendChild(el("div","ex-cue-inline", escapeHtml(ex.cue)));
        var videoLink = el("a","video-link","▶ How to");
        videoLink.href = videoSearchUrl(ex.name);
        videoLink.target = "_blank";
        videoLink.rel = "noopener noreferrer";
        videoLink.setAttribute("aria-label", "Search YouTube for how to do " + ex.name);
        textCol.appendChild(videoLink);
        bodyRow.appendChild(textCol);
        var thumb = el("button","muscle-thumb");
        thumb.setAttribute("aria-label", "Show " + ex.name + " exercise preview");
        thumb.appendChild(exerciseVisual(ex.name));
        thumb.addEventListener("click", function(){ openMuscleSheet(ex.name, ex.muscle); });
        bodyRow.appendChild(thumb);
        card.appendChild(bodyRow);
      }

      var log = el("div","ex-log");
      var dots = el("div","set-dots");
      var key = idx + ":" + ex.name;
      day.log.sets[key] = day.log.sets[key] || [];
      for(var s=0; s<ex.sets; s++){
        (function(s){
          var done = !!day.log.sets[key][s];
          var d = el("button","set-dot", String(s+1));
          d.setAttribute("aria-pressed", String(done));
          d.addEventListener("click", function(){
            day.log.sets[key][s] = !day.log.sets[key][s];
            save(); renderMain();
          });
          dots.appendChild(d);
        })(s);
      }
      log.appendChild(dots);

      var wf = el("div","weight-field");
      var wi = document.createElement("input");
      wi.type = "number"; wi.inputMode = "decimal"; wi.placeholder = "—";
      wi.value = day.log.weights[key] != null ? day.log.weights[key] : "";
      wi.addEventListener("input", function(){
        day.log.weights[key] = wi.value === "" ? null : wi.value;
        save();
      });
      wf.appendChild(wi);
      wf.appendChild(el("span", null, "kg"));
      log.appendChild(wf);

      card.appendChild(log);

      var hint = getProgressionHint(ex.name);
      if(hint) card.appendChild(el("div","progress-hint", hint));
    }
    return card;
  }

  function labeledInput(label, obj, key, type){
    var wrap = document.createElement("div");
    var l = document.createElement("label"); l.textContent = label; wrap.appendChild(l);
    var i = document.createElement("input");
    i.type = type || "text"; i.value = obj[key] != null ? obj[key] : "";
    i.addEventListener("input", function(){
      obj[key] = type === "number" ? Number(i.value||0) : i.value;
      save();
    });
    wrap.appendChild(i);
    return wrap;
  }

  function dayProgress(day){
    var total = 0, done = 0;
    day.exercises.forEach(function(ex, idx){
      var key = idx + ":" + ex.name;
      var arr = day.log.sets[key] || [];
      total += ex.sets;
      for(var i=0;i<ex.sets;i++){ if(arr[i]) done++; }
    });
    return {done: done, total: total};
  }

  var STALL_SESSIONS = 3;

  function getProgressionHint(name){
    var hist = state.exerciseHistory[name];
    if(!hist || !hist.length) return null;
    var last = hist[hist.length-1];
    if(last.setsDone < last.setsTotal){
      return "Didn't finish all sets last time — match the weight and aim to complete them.";
    }
    if(last.weight == null){
      return "Completed every set last time — try adding a rep or a harder variation.";
    }
    var streak = 0;
    for(var i=hist.length-1; i>=0; i--){
      var h = hist[i];
      if(h.setsDone >= h.setsTotal && h.weight === last.weight) streak++;
      else break;
    }
    if(streak >= STALL_SESSIONS){
      return "Same weight " + streak + " sessions running — try a small increase or check form.";
    }
    return "Finished all sets last time — try a bit more weight or an extra rep.";
  }

  function renderBottomBar(day){
    var p = dayProgress(day);
    document.getElementById("progressText").innerHTML = "<b>" + p.done + "/" + p.total + "</b> logged";
    var btn = document.getElementById("completeBtn");
    var completedToday = state.history.some(function(h){ return h.dayId===day.id && h.date===todayStr(); });
    btn.textContent = completedToday ? "Day complete ✓" : "Complete day";
    btn.setAttribute("data-done", String(completedToday));
    btn.disabled = editMode || day.exercises.length===0;
    btn.onclick = function(){
      if(completedToday) return;
      state.history.push({dayId: day.id, date: todayStr(), done: p.done, total: p.total});
      day.exercises.forEach(function(ex, idx){
        var key = idx + ":" + ex.name;
        var arr = day.log.sets[key] || [];
        var setsDone = 0;
        for(var i=0;i<ex.sets;i++){ if(arr[i]) setsDone++; }
        var wRaw = day.log.weights[key];
        var weight = (wRaw != null && wRaw !== "" && !isNaN(Number(wRaw))) ? Number(wRaw) : null;
        if(!state.exerciseHistory[ex.name]) state.exerciseHistory[ex.name] = [];
        state.exerciseHistory[ex.name].push({date: todayStr(), weight: weight, setsDone: setsDone, setsTotal: ex.sets});
        if(state.exerciseHistory[ex.name].length > 20) state.exerciseHistory[ex.name].shift();
      });
      save();
      toast("Nice work — day logged 💪");
      renderMain();
    };
  }

  function renderStreak(){
    document.getElementById("streak").textContent = "🔥 " + computeStreak();
  }

  function openSettings(){
    settingsOpen = true;
    renderSettingsOverlay();
  }

  function closeSettings(){
    settingsOpen = false;
    document.getElementById("menuLayer").innerHTML = "";
  }

  function renderSettingsOverlay(){
    var layer = document.getElementById("menuLayer");
    layer.innerHTML = "";
    var overlay = el("div","settings-overlay");

    var header = el("div","settings-header");
    header.appendChild(el("div","settings-title display","SETTINGS"));
    var closeBtn = el("button","settings-close","✕");
    closeBtn.addEventListener("click", closeSettings);
    header.appendChild(closeBtn);
    overlay.appendChild(header);

    var content = el("div","settings-content");

    content.appendChild(el("div","section-label","Your equipment"));
    var equipCard = el("div","simple-card");
    var chipWrap = el("div","equip-chips");
    state.equipment.forEach(function(item){
      var chip = el("div","equip-chip");
      chip.appendChild(el("span",null, escapeHtml(item.name)));
      var x = el("button","equip-x","✕");
      x.setAttribute("aria-label","Remove " + item.name);
      x.addEventListener("click", function(){ removeEquipmentItem(item.id); renderSettingsOverlay(); });
      chip.appendChild(x);
      chipWrap.appendChild(chip);
    });
    if(!state.equipment.length){
      chipWrap.appendChild(el("p","empty-note","No equipment added yet."));
    }
    equipCard.appendChild(chipWrap);

    var addRow = el("div","add-equip-row");
    var addInput = document.createElement("input");
    addInput.placeholder = "Add equipment (e.g. Preacher curl bench)";
    var addBtn = el("button","add-equip-btn","Add");
    function doAdd(){
      if(!addInput.value.trim()) return;
      addEquipmentItem(addInput.value);
      renderSettingsOverlay();
    }
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } });
    addRow.appendChild(addInput); addRow.appendChild(addBtn);
    equipCard.appendChild(addRow);
    content.appendChild(equipCard);

    content.appendChild(el("div","section-label","Training program"));
    var progCard = el("div","simple-card");
    progCard.appendChild(el("div","field-label","Days per week"));
    var daysRow = el("div","days-row");
    [2,3,4,5,6].forEach(function(n){
      var pill = el("button","day-pill", String(n));
      if(state.settings.daysPerWeek===n) pill.setAttribute("data-on","true");
      pill.addEventListener("click", function(){
        state.settings.daysPerWeek = n; save(); renderSettingsOverlay();
      });
      daysRow.appendChild(pill);
    });
    progCard.appendChild(daysRow);

    var splitTemplate = SPLIT_TEMPLATES[state.settings.daysPerWeek] || SPLIT_TEMPLATES[3];
    progCard.appendChild(el("p","split-preview", "Split: " + splitTemplate.map(function(s){return s.label;}).join(" → ")));

    var suggestBtn = el("button","suggest-btn", "Suggest a " + state.settings.daysPerWeek + "-day program");
    suggestBtn.addEventListener("click", suggestProgram);
    progCard.appendChild(suggestBtn);

    if(state.previousPlans.length){
      var restoreBtn = el("button","restore-link", "↶ Back to previous plan (" + state.previousPlans.length + " saved)");
      restoreBtn.addEventListener("click", restorePreviousPlan);
      progCard.appendChild(restoreBtn);
    }

    content.appendChild(progCard);

    content.appendChild(el("div","section-label","Your training log"));
    var logCard = el("div","simple-card");
    var sessionCount = state.history.length;
    var statsLines = ["<b>" + sessionCount + "</b> session" + (sessionCount===1?"":"s") + " completed"];
    if(sessionCount){
      var dates = state.history.map(function(h){ return h.date; }).slice().sort();
      statsLines.push("since <b>" + dates[0] + "</b>");
    }
    var exCount = Object.keys(state.exerciseHistory).length;
    if(exCount) statsLines.push("<b>" + exCount + "</b> exercise" + (exCount===1?"":"s") + " tracked");
    var stats = el("p","log-stats");
    stats.innerHTML = statsLines.join(" · ");
    logCard.appendChild(stats);

    var copyBtn = el("button","copy-log-btn","Copy log for coaching");
    copyBtn.addEventListener("click", function(){
      var text = buildTrainingLogText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          toast("Log copied — paste it into a chat with Claude 📋");
        }).catch(function(){
          toast("Couldn't auto-copy — select the text below instead");
        });
      } else {
        toast("Select the text below and copy manually");
      }
    });
    logCard.appendChild(copyBtn);

    logCard.appendChild(el("div","log-preview-label","Preview (select all to copy manually)"));
    var preview = document.createElement("textarea");
    preview.className = "log-preview";
    preview.readOnly = true;
    preview.value = buildTrainingLogText();
    preview.addEventListener("click", function(){ preview.select(); });
    logCard.appendChild(preview);

    content.appendChild(logCard);
    overlay.appendChild(content);
    layer.appendChild(overlay);
  }

  function renderAll(){
    renderTabs();
    renderMain();
  }

  document.getElementById("gearBtn").addEventListener("click", openSettings);
  renderAll();
})();
</script>
</body>
</html>
